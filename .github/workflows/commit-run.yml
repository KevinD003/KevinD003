name: Regenerate COMMIT RUN

on:
  schedule:
    - cron: "17 4 * * *"   # every morning, after the previous day has settled
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/commit-run.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-run
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/fetch-contributions.mjs ${{ github.repository_owner }}

      - name: Generate level + animation
        run: node tools/gen-runner.mjs

      - name: Bust the image cache
        # GitHub proxies README images and caches them hard. Without a version
        # token that changes with the content, a regenerated banner is never
        # actually shown on the profile — the old frame is served indefinitely.
        run: |
          sed -i -E "s|(commit-run\.svg\?v=)[0-9]+|\1$(date -u +%Y%m%d%H%M)|" README.md

      - name: Commit if the level changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/commit-run.svg docs/level.js README.md
          if git diff --staged --quiet; then
            echo "No change in contribution data — nothing to commit."
          else
            git commit -m "chore: regenerate COMMIT RUN from latest contributions"
            git push
          fi
