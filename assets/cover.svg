<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Kevin Davra — FY2026 Annual Report. Finance brain, builder's hands. Seven products shipped across seven industries, Dallas, Texas.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070b14"/><stop offset="100%" stop-color="#0f1a2e"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#f5d77a"/><stop offset="100%" stop-color="#c9962b"/>
  </linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e3b448" stop-opacity="0.28"/><stop offset="100%" stop-color="#e3b448" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
  </pattern>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="card"><rect width="1200" height="460" rx="22"/></clipPath>
  <clipPath id="tape"><rect x="0" y="404" width="1200" height="56"/></clipPath>
  <style>
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
    .sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .k{font-size:13px;letter-spacing:3.5px;fill:#8ea3c0}
    .fade{opacity:0;animation:in .9s ease-out forwards}
    .d1{animation-delay:.15s}.d2{animation-delay:.45s}.d3{animation-delay:.75s}.d4{animation-delay:1.05s}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .line{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.6s .6s cubic-bezier(.6,.1,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .pulse{animation:p 1.6s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
  </style>
</defs>

<g clip-path="url(#card)">
  <rect width="1200" height="460" fill="url(#bg)"/>
  <rect width="1200" height="460" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#gold)"/>

  <!-- masthead -->
  <text class="mono k fade" x="64" y="62">ANNUAL REPORT · FY2026</text>
  <text class="mono k fade" x="1136" y="62" text-anchor="end">NYSE: <tspan fill="#f2c55c">$KVND</tspan> · DALLAS, TX</text>
  <line x1="64" y1="80" x2="1136" y2="80" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- title block -->
  <text class="sans fade d1" x="62" y="168" font-size="76" font-weight="800" fill="#f4f6fb" letter-spacing="-1.5">Kevin Davra</text>
  <text class="sans fade d2" x="64" y="214" font-size="30" font-weight="600" fill="url(#gold)">Finance brain. Builder's hands.</text>
  <text class="sans fade d3" x="64" y="262" font-size="18" fill="#a9b7cc">I take the problems finance people solve in spreadsheets —</text>
  <text class="sans fade d3" x="64" y="288" font-size="18" fill="#a9b7cc">and ship them as production software, built AI-native.</text>

  <!-- pills -->
  <g class="fade d4 mono" font-size="13" letter-spacing="1">
    <rect x="64" y="318" width="168" height="34" rx="17" fill="#e3b448" fill-opacity="0.12" stroke="#e3b448" stroke-opacity="0.5"/>
    <text x="148" y="340" text-anchor="middle" fill="#f2c55c">7 PRODUCTS</text>
    <rect x="244" y="318" width="178" height="34" rx="17" fill="#5cc8ff" fill-opacity="0.10" stroke="#5cc8ff" stroke-opacity="0.45"/>
    <text x="333" y="340" text-anchor="middle" fill="#8fd9ff">7 INDUSTRIES</text>
    <rect x="434" y="318" width="196" height="34" rx="17" fill="#5ee6a8" fill-opacity="0.10" stroke="#5ee6a8" stroke-opacity="0.45"/>
    <circle class="pulse" cx="456" cy="335" r="4" fill="#5ee6a8"/>
    <text x="542" y="340" text-anchor="middle" fill="#8ff0c4">OPEN TO ROLES</text>
  </g>

  <!-- chart panel -->
  <g transform="translate(720,112)">
    <rect width="416" height="250" rx="14" fill="#0b1324" stroke="#ffffff" stroke-opacity="0.07"/>
    <text class="mono" x="22" y="32" font-size="12" letter-spacing="2.5" fill="#8ea3c0">LINES SHIPPED · CUMULATIVE</text>
    <text class="mono" x="394" y="32" font-size="12" text-anchor="end" fill="#5ee6a8">▲ 900K+</text>
    <g stroke="#ffffff" stroke-opacity="0.06">
      <line x1="22" y1="80" x2="394" y2="80"/><line x1="22" y1="130" x2="394" y2="130"/><line x1="22" y1="180" x2="394" y2="180"/><line x1="22" y1="222" x2="394" y2="222"/>
    </g>
    <path d="M22 222 L68 218 L114 212 L160 205 L206 190 L252 172 L298 140 L344 98 L394 58 L394 222 Z" fill="url(#area)" class="fade d4"/>
    <path class="line" d="M22 222 L68 218 L114 212 L160 205 L206 190 L252 172 L298 140 L344 98 L394 58" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="394" cy="58" r="5" fill="#f5d77a" class="fade d4 pulse"/>
    <g class="mono" font-size="10" fill="#5d6f8a">
      <text x="22" y="240">STIQ</text><text x="114" y="240">KAIL</text><text x="206" y="240">TALY</text><text x="298" y="240">VACA</text><text x="394" y="240" text-anchor="end">DESI</text>
    </g>
  </g>

  <!-- ticker tape -->
  <rect x="0" y="404" width="1200" height="56" fill="#05080f"/>
  <line x1="0" y1="404" x2="1200" y2="404" stroke="#e3b448" stroke-opacity="0.35"/>
  <g clip-path="url(#tape)">
    <g class="mono" font-size="16" letter-spacing="1">
      <text y="438">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1600 0" dur="28s" repeatCount="indefinite"/>
        <tspan x="20"  fill="#f4f6fb">$DESI</tspan><tspan fill="#5ee6a8"> ▲ LIVE MARKETPLACE</tspan>
        <tspan x="340" fill="#f4f6fb">$LEAD</tspan><tspan fill="#5ee6a8"> ▲ 226 API ENDPOINTS</tspan>
        <tspan x="680" fill="#f4f6fb">$TALY</tspan><tspan fill="#5ee6a8"> ▲ 24-MO FORECAST</tspan>
        <tspan x="990" fill="#f4f6fb">$KAIL</tspan><tspan fill="#5ee6a8"> ▲ MCP SERVER</tspan>
        <tspan x="1260" fill="#f4f6fb">$VACA</tspan><tspan fill="#5ee6a8"> ▲ LIGHTGBM</tspan>
        <tspan x="1600" fill="#f4f6fb">$DESI</tspan><tspan fill="#5ee6a8"> ▲ LIVE MARKETPLACE</tspan>
        <tspan x="1940" fill="#f4f6fb">$LEAD</tspan><tspan fill="#5ee6a8"> ▲ 226 API ENDPOINTS</tspan>
        <tspan x="2280" fill="#f4f6fb">$TALY</tspan><tspan fill="#5ee6a8"> ▲ 24-MO FORECAST</tspan>
        <tspan x="2590" fill="#f4f6fb">$KAIL</tspan><tspan fill="#5ee6a8"> ▲ MCP SERVER</tspan>
      </text>
    </g>
  </g>
</g>
<rect x="0.5" y="0.5" width="1199" height="459" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
