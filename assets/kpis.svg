<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Key metrics: 7 products, 900K+ lines of code, 1,095 test files, 7 industries, 0 made-up numbers.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070b14"/><stop offset="100%" stop-color="#0f1a2e"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#f5d77a"/><stop offset="100%" stop-color="#c9962b"/>
  </linearGradient>
  <style>
    .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
    .sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .lbl{font-size:12px;letter-spacing:2.5px;fill:#8ea3c0}
    .num{font-size:50px;font-weight:800;fill:#f4f6fb;letter-spacing:-1px}
    .sub{font-size:13px;fill:#6f819c}
    .t{opacity:0;animation:in .7s ease-out forwards}
    .t1{animation-delay:.1s}.t2{animation-delay:.3s}.t3{animation-delay:.5s}.t4{animation-delay:.7s}.t5{animation-delay:.9s}
    @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s 1s cubic-bezier(.6,.1,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
  </style>
</defs>
<rect width="1200" height="220" rx="22" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="1199" height="219" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
<text class="mono lbl" x="40" y="40">KEY METRICS · AUDITED FROM SOURCE</text>
<text class="mono lbl" x="1160" y="40" text-anchor="end" fill="#5ee6a8">● FY2026</text>

<g transform="translate(40,62)"><g class="t t1">
  <rect width="208" height="128" rx="14" fill="#0b1324" stroke="#ffffff" stroke-opacity="0.07"/>
  <text class="sans num" x="22" y="66">7</text>
  <text class="mono lbl" x="22" y="94">PRODUCTS</text>
  <text class="sans sub" x="22" y="114">1 live · 6 in build/beta</text>
  <rect class="bar" x="22" y="12" width="164" height="3" rx="1.5" fill="url(#gold)"/>
</g></g>
<g transform="translate(264,62)"><g class="t t2">
  <rect width="208" height="128" rx="14" fill="#0b1324" stroke="#ffffff" stroke-opacity="0.07"/>
  <text class="sans num" x="22" y="66">900K+</text>
  <text class="mono lbl" x="22" y="94">LINES SHIPPED</text>
  <text class="sans sub" x="22" y="114">Python · TS · JS · SQL</text>
  <rect class="bar" x="22" y="12" width="164" height="3" rx="1.5" fill="#5cc8ff"/>
</g></g>
<g transform="translate(488,62)"><g class="t t3">
  <rect width="208" height="128" rx="14" fill="#0b1324" stroke="#ffffff" stroke-opacity="0.07"/>
  <text class="sans num" x="22" y="66">1,095</text>
  <text class="mono lbl" x="22" y="94">TEST FILES</text>
  <text class="sans sub" x="22" y="114">unit · e2e · security</text>
  <rect class="bar" x="22" y="12" width="164" height="3" rx="1.5" fill="#5ee6a8"/>
</g></g>
<g transform="translate(712,62)"><g class="t t4">
  <rect width="208" height="128" rx="14" fill="#0b1324" stroke="#ffffff" stroke-opacity="0.07"/>
  <text class="sans num" x="22" y="66">7</text>
  <text class="mono lbl" x="22" y="94">INDUSTRIES</text>
  <text class="sans sub" x="22" y="114">fintech → travel → events</text>
  <rect class="bar" x="22" y="12" width="164" height="3" rx="1.5" fill="#b78cff"/>
</g></g>
<g transform="translate(936,62)"><g class="t t5">
  <rect width="224" height="128" rx="14" fill="#16130a" stroke="#e3b448" stroke-opacity="0.45"/>
  <text class="sans num" x="22" y="66" fill="url(#gold)" style="fill:url(#gold)">0</text>
  <text class="mono lbl" x="22" y="94" style="fill:#f2c55c">MADE-UP NUMBERS</text>
  <text class="sans sub" x="22" y="114">every repo ships its limits</text>
</g></g>
</svg>
